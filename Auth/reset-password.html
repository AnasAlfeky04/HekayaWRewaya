
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#176b55">
  <title>إعادة تعيين كلمة المرور | حكاية ورواية</title>
  <link rel="icon" type="image/png" href="TabLogo.png">
  <link rel="stylesheet" href="/styles.css">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 10% 10%, #e5eee3 0, transparent 32%),
        var(--paper);
    }

    .reset-navbar {
      max-width: 1200px;
      width: 100%;
      margin: auto;
      padding: 22px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .reset-navbar img {
      display: block;
      width: 200px;
      height: 90px;
      object-fit: contain;
    }

    .reset-card {
      width: min(460px, calc(100% - 36px));
      margin: 35px auto 65px;
      padding: 42px 35px;
      border: 1px solid #e9e9df;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 20px 65px #234b3510;
    }

    .reset-icon {
      width: 62px;
      height: 62px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #edf5ef;
      color: #176b55;
      font-size: 27px;
    }

    .reset-heading {
      margin-bottom: 28px;
      text-align: center;
    }

    .reset-heading h1 {
      margin: 8px 0;
      font-size: 25px;
      color: var(--ink);
    }

    .reset-heading p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 2;
    }

    .reset-form {
      display: grid;
      gap: 16px;
    }

    .reset-field label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 700;
    }

    .reset-field input {
      width: 100%;
      min-height: 47px;
      padding: 11px 13px;
      border: 1px solid #e2e5dd;
      border-radius: 10px;
      outline: none;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 12px;
    }

    .reset-field input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px #176b5515;
    }

    .reset-submit {
      width: 100%;
      min-height: 48px;
      margin-top: 5px;
      font-size: 13px;
    }

    .reset-status {
      margin: 0;
      padding: 11px;
      border-radius: 9px;
      font-size: 12px;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    .reset-status:empty {
      display: none;
    }

    .reset-status.error {
      background: #fff0ed;
      color: #a62c21;
    }

    .reset-status.success {
      background: #eaf5ed;
      color: #176b55;
    }

    .reset-back {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    .reset-back:hover {
      color: var(--green);
    }

    @media (max-width: 600px) {
      .reset-navbar {
        padding: 15px 18px;
      }

      .reset-navbar img {
        width: 155px;
        height: 70px;
      }

      .reset-card {
        margin-top: 15px;
        padding: 32px 23px;
      }

      .reset-heading h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <header class="reset-navbar">
    <a href="/index.html">
      <img src="Logo.png" alt="حكاية ورواية">
    </a>
    <a href="/index.html" class="btn btn-outline">الرئيسية</a>
  </header>

  <main class="reset-card">
    <div class="reset-icon">🔐</div>

    <div class="reset-heading">
      <span class="tag">حسابك في أمان</span>
      <h1>تعيين كلمة مرور جديدة</h1>
      <p>اكتب كلمة المرور الجديدة لحسابك، واستخدمها بعد ذلك لتسجيل الدخول.</p>
    </div>

    <form class="reset-form" id="resetForm" hidden>
      <div class="reset-field">
        <label for="newPassword">كلمة المرور الجديدة</label>
        <input
          id="newPassword"
          type="password"
          autocomplete="new-password"
          minlength="8"
          placeholder="8 أحرف على الأقل"
          required
        >
      </div>

      <div class="reset-field">
        <label for="confirmPassword">تأكيد كلمة المرور الجديدة</label>
        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="8"
          placeholder="اكتب كلمة المرور مرة أخرى"
          required
        >
      </div>

      <p id="resetStatus" class="reset-status" role="status" aria-live="polite"></p>

      <button type="submit" class="btn btn-primary reset-submit" id="resetSubmit">
        حفظ كلمة المرور الجديدة
      </button>
    </form>

    <p id="pageStatus" class="reset-status" role="status" aria-live="polite">
      جارٍ التحقق من رابط الاستعادة...
    </p>

    <a href="/Auth/auth.html?mode=login" class="reset-back">
      العودة إلى تسجيل الدخول
    </a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://aibgixalrifqbsotiogu.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_5hGz5nIAT9I_6Y52emiERA_5qbTioxB";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const resetForm = document.getElementById("resetForm");
    const newPassword = document.getElementById("newPassword");
    const confirmPassword = document.getElementById("confirmPassword");
    const resetSubmit = document.getElementById("resetSubmit");
    const resetStatus = document.getElementById("resetStatus");
    const pageStatus = document.getElementById("pageStatus");

    let recoveryReady = false;
    let submitting = false;

    function setResetStatus(message, type) {
      resetStatus.textContent = message;
      resetStatus.className =
        "reset-status" + (type ? " " + type : "");
    }

    function showRecoveryForm() {
      if (recoveryReady) return;

      recoveryReady = true;
      resetForm.hidden = false;
      pageStatus.hidden = true;
    }

    function showInvalidLink() {
      if (recoveryReady) return;

      pageStatus.textContent =
        "رابط الاستعادة غير صالح أو انتهت صلاحيته. ارجع لصفحة تسجيل الدخول واطلب رابطًا جديدًا.";
      pageStatus.className = "reset-status error";
    }

    db.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) {
        showRecoveryForm();
      }
    });

    async function checkRecoverySession() {
      try {
        const { data, error } = await db.auth.getSession();

        if (error) throw error;

        if (data.session) {
          showRecoveryForm();
        } else {
          showInvalidLink();
        }
      } catch (error) {
        console.error("Recovery session error:", error);
        showInvalidLink();
      }
    }

    resetForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (submitting || !recoveryReady) return;

      setResetStatus("", "");

      const passwordValue = newPassword.value;
      const confirmValue = confirmPassword.value;

      if (passwordValue.length < 8) {
        setResetStatus(
          "كلمة المرور يجب أن تكون 8 أحرف على الأقل.",
          "error"
        );
        newPassword.focus();
        return;
      }

      if (passwordValue !== confirmValue) {
        setResetStatus(
          "كلمتا المرور غير متطابقتين. راجعهما وحاول مرة أخرى.",
          "error"
        );
        confirmPassword.focus();
        return;
      }

      submitting = true;
      resetSubmit.disabled = true;
      resetSubmit.textContent = "جارٍ حفظ كلمة المرور...";

      try {
        const { error } = await db.auth.updateUser({
          password: passwordValue
        });

        if (error) throw error;

        setResetStatus(
          "تم تغيير كلمة المرور بنجاح. جاري تحويلك إلى تسجيل الدخول...",
          "success"
        );

        resetForm.querySelectorAll("input").forEach(input => {
          input.disabled = true;
        });

        setTimeout(async () => {
          await db.auth.signOut();
          window.location.href = "/Auth/auth.html?mode=login";
        }, 1800);

      } catch (error) {
        console.error("Password update error:", error);

        const message = (error.message || "").toLowerCase();

        if (
          message.includes("same password") ||
          message.includes("different from")
        ) {
          setResetStatus(
            "اختار كلمة مرور مختلفة عن كلمة المرور الحالية.",
            "error"
          );
        } else if (
          message.includes("password") ||
          message.includes("weak")
        ) {
          setResetStatus(
            "كلمة المرور غير مستوفية للشروط المطلوبة. حاول اختيار كلمة مرور أقوى.",
            "error"
          );
        } else {
          setResetStatus(
            "تعذر تغيير كلمة المرور حاليًا. حاول مرة أخرى.",
            "error"
          );
        }

      } finally {
        submitting = false;
        resetSubmit.disabled = false;
        resetSubmit.textContent = "حفظ كلمة المرور الجديدة";
      }
    });

    checkRecoverySession();
  </script>

    <div id="global-scrollbar">
        <div class="scrollbar-track">
          <div class="scrollbar-thumb"></div>
        </div>
    </div>

  <link rel="stylesheet" href="/Scrollbar/global-scrollbar.css">
  <script src="/Scrollbar/global-scrollbar.js"></script>
</body>
</html>
