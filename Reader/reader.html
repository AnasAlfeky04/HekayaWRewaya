<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#123d32">
  <title>قارئ الروايات | حكاية ورواية</title>
  <link rel="icon" type="image/png" href="TabLogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="reader.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script defer src="reader.js"></script>
</head>
<body>
  <div class="reader-app">
    <header class="topbar">
      <a class="brand" href="/Library/library.html" aria-label="العودة إلى مكتبتي">
        <span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 7.5c4.6-1.7 8.6-.9 12 2.2v16c-3.4-3.1-7.4-3.9-12-2.2zM28 7.5c-4.6-1.7-8.6-.9-12 2.2v16c3.4-3.1 7.4-3.9 12-2.2z"/><path d="M16 9.7v16"/></svg></span>
        <span class="brand-copy"><strong>حكاية ورواية</strong><small>مساحة القراءة</small></span>
      </a>
      <div class="book-heading"><span class="eyebrow">تقرأ الآن</span><h1 id="bookTitle">قارئ الروايات</h1></div>
      <div class="top-actions">
        <button class="icon-btn" id="themeBtn" title="الوضع الليلي" aria-label="تبديل الوضع الليلي"><svg viewBox="0 0 24 24"><path d="M20.5 15.2A8.7 8.7 0 0 1 8.8 3.5 8.8 8.8 0 1 0 20.5 15.2Z"/></svg></button>
        <button class="icon-btn" id="fullscreenBtn" title="ملء الشاشة" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button>
        <a class="back-link" href="/My Library/MyLibrary.html">مكتبتي</a>
      </div>
    </header>

    <nav class="toolbar" aria-label="أدوات القراءة">
      <div class="tool-group search-group"><button class="tool-btn" id="searchToggle" title="البحث"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><span>بحث</span></button><div class="search-box" id="searchBox" hidden><input id="searchInput" type="search" placeholder="ابحث عن كلمة داخل الرواية" aria-label="كلمة البحث"><button class="mini-btn" id="searchPrev" title="النتيجة السابقة">↑</button><button class="mini-btn" id="searchNext" title="النتيجة التالية">↓</button><span id="searchStatus" class="search-status"></span></div></div>
      <span class="toolbar-separator"></span>
      <button class="tool-btn" id="bookmarkBtn" title="حفظ علامة مرجعية"><svg viewBox="0 0 24 24"><path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-4-6 4z"/></svg><span>علامة مرجعية</span></button>
      <span class="toolbar-separator"></span>
      <div class="zoom-tools"><button class="mini-btn" id="zoomOut" aria-label="تصغير">−</button><span id="zoomLabel">100%</span><button class="mini-btn" id="zoomIn" aria-label="تكبير">+</button><button class="tool-btn fit-btn" id="fitBtn" title="ملاءمة الصفحتين"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>ملاءمة</span></button></div>
      <span class="toolbar-separator"></span>
      <form class="page-jump" id="pageForm"><label for="pageInput">صفحة</label><input id="pageInput" type="number" min="1" value="1"><span class="page-total">من <b id="pageTotal">—</b></span><button class="mini-btn go-btn" type="submit">انتقال</button></form>
    </nav>

    <main class="reading-area" id="readingArea">
      <button class="turn-btn turn-next" id="nextBtn" aria-label="الصفحتان التاليتان" title="التالي"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <section class="book-stage" id="bookStage" aria-label="صفحات الرواية">
        <div class="loading-state" id="loadingState"><span class="spinner"></span><strong>بنجهّز صفحات روايتك</strong><p id="readerMessage">لحظات وتبدأ القراءة...</p></div>
        <div class="page-spread" id="pageSpread" hidden>
          <div class="page-sheet page-left"><canvas id="pageLeft"></canvas><div class="text-layer" id="textLeft"></div></div>
          <div class="book-gutter" aria-hidden="true"></div>
          <div class="page-sheet page-right"><canvas id="pageRight"></canvas><div class="text-layer" id="textRight"></div></div>
        </div>
      </section>
      <button class="turn-btn turn-prev" id="prevBtn" aria-label="الصفحتان السابقتان" title="السابق"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
    </main>
    <footer class="reader-footer"><div class="reading-progress"><span id="progressBar"></span></div><div class="footer-meta"><span id="pageCaption">جاهز للقراءة</span><span class="secure-note"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>قراءة آمنة</span></div></footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</body>
</html>
